services:
  postgres:
    image: postgres:16
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: admin
        POSTGRES_DB: LOS_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: 
      - "5432:5432" 
  
  backend:
    build:
       context: .
       dockerfile: LOS_Backend_Service/LOS_Backend_Service/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres; Port=5432;Database=LOS_DB;Username=postgres;Password=admin"
    depends_on:
      - postgres
    ports:
      - "8080:8080"
  
  frontend:
    build: ./LOS_Frontend
    depends_on:
      - backend
    ports:
      - "80:80"
volumes:
  pgdata: